name = "parsefree-worker"
main = "src/index.js"
compatibility_date = "2024-01-01"

# 每日定时探测触发器（每15分钟检查一次今日新源，一旦成功获取即停止探测并锁定）
[triggers]
crons = ["*/15 * * * *"]

# 可选的环境变量配置
# [vars]
# AUTH_PASSWORD = "your_secret_password"
# AUTH_USERNAME = "admin"
# FIRST_NODE_NAME = "HOS Daily官方维护"
# NODE_PREFIX = "HOS自动化线路 "
# SOURCE_TYPE = "clash" # clash 或 v2ray
# CUSTOM_SOURCE_URL = "" # 手动指定固定源地址
